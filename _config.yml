markdown: kramdown

kramdown:
  input: GFM
  hard_wrap: false
  toc_levels: "1..2"
  parse_block_html: false
  syntax_highlighter_opts:
    disable: true

sass:
  style: compressed
  sass_dir: ./sass

# Anything in the source root that is not excluded here (and does not start with "." or "_")
# is copied verbatim into _site as a static file, so tooling files must be listed explicitly.
exclude: ['*.sh', '*.py', 'Dockerfile*', 'wrangler.toml', 'LICENSE', 'build_releasenotes.rb', 'sass', '.idea', '.jekyll-cache', 'README*', 'CLAUDE.md', 'KEY_TERMS.md', 'SECURITY_DOCS*', 'VERSION_MARKERS*']

xinclude: ['robots.txt', 'sitemap.xml', 'llms.txt', 'llms-full.txt', 'security.txt']

plugins:
  - jekyll-relative-links
  - algoliasearch-jekyll

elasticsearch:
  #majorversion: 9 # unused and not relevant any longer
  minorversion: 9.4 #this is the current minor version
  #previousminorversion: 9.1 # unused and not relevant any longer
  currentversion: 9.4.4 #this is the current full version available, match minorversion
  currentversionlastmajor: 8.19.19 #the full version of the last major version

searchguard:
  version: "SG FLX" # static, won't change
  islatestversion: true # static, won't change
  currentversion: "4.1.2" # current full version of SG FLX
  #currentversionlastmajor: "3.1.3" # unused and not relevant any longer
  releasedate: 2026-07-29

index: false

relative_links:
  enabled:     true
  collections: true

collections_dir: _content

